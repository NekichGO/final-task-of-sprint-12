name: deploy-pipeline

on:
  push:
    branches: [main]
    tags: ['v*']

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
      - uses: actions/checkout@v7

      - name: Run Tests
        run: GOOS=linux GOARCH=amd64 go test

      - name: Find code errors
        run: go vet ./...

  deploy:
    name: Push in Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_FINAL_SPRINT_12 }}
          password: ${{ secrets.DOCKER_FINAL_SPRINT_12_ACCESS_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: nekichgo/final-task-of-sprint-12

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
